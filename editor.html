<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Layout editor</title>
<style>
:root{--bg:#0a0a0b;--card:#141416;--line:#2a2a2e;--tx:#f2f2f3;--mu:#9a9aa2;--ac:#ffb020;--bad:#ff5d5d}
@media(prefers-color-scheme:light){:root{--bg:#f6f6f7;--card:#fff;--line:#d9d9de;--tx:#111;--mu:#666;--ac:#b86e00;--bad:#c62828}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;padding:20px;max-width:860px;margin-inline:auto}
h1{margin:0 0 4px;font-size:26px}h2{font-size:17px;margin:28px 0 8px}
p{color:var(--mu);margin:4px 0 14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
button,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover,select:hover{border-color:var(--ac)}
.tabs button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#111;font-weight:600}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:7px}
.row.off{opacity:.5}
.row.over{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.row.drag{opacity:.35}
.h{cursor:grab;color:var(--mu);user-select:none;font-size:18px;line-height:1}
.nm{flex:1;min-width:0}
.nm b{display:block}.nm small{color:var(--mu)}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
.row .b{padding:3px 9px}
.cu{width:100%;margin-top:6px;font:12px/1.4 ui-monospace,Consolas,monospace;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px;resize:vertical;min-height:54px}
.cu.bad{border-color:var(--bad)}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#out{width:100%;height:300px;font:12px/1.45 ui-monospace,Consolas,monospace;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px}
.ok{color:var(--ac);margin-left:8px}
</style>
</head>
<body>
<h1>Layout editor</h1>
<p>Row ko pakad kar (&#9776;) upar-niche drag karo, ya &#8593; &#8595; dabao. Checkbox hatao = section hide (comment). Phir neeche &ldquo;Copy&rdquo; dabao aur <b>layout.js</b> ki poori content replace kar do. Uske baad <code>node build.js</code> chalao.</p>

<div class="tabs" id="tabs" role="group" aria-label="Page"></div>
<div id="list"></div>

<div class="add">
  <select id="type" aria-label="Block type">
    <option value="text">Text section</option>
    <option value="banner">Banner (strip + button)</option>
    <option value="tiles">Tiles (cards)</option>
    <option value="image">Image</option>
    <option value="html">Raw HTML</option>
  </select>
  <button id="add" type="button">+ Add new section to this page</button>
</div>

<h2>Output: layout.js</h2>
<textarea id="out" readonly aria-label="Generated layout.js"></textarea>
<p><button id="copy" type="button">Copy</button> <button id="dl" type="button">Download layout.js</button><span class="ok" id="msg"></span></p>

<script src="layout.js"></script>
<script>
(()=>{
const PAGES={
  home:{label:'Home',secs:{hero:'Image slider',tech:'Technology solutions (products)',cfg:'Configure your drone stack',process:'From bench to sky (steps)',manifesto:'Big manifesto line',cta:'Talk to our engineers strip'}},
  products:{label:'Products',secs:{catalog:'Title + filters + product grid'}},
  product:{label:'Product page',secs:{main:'Photo, highlights, specs, buttons',journey:'From bench to sky (per product)',faq:'Product FAQ',related:'More products',regulatory:'Regulatory note'}},
  about:{label:'About',secs:{intro:'Top hero',ticker:'Moving ticker',stats:'Numbers',who:'Who we are, Mission, Vision',values:'How we work',build:'What we engineer',story:'Our story (timeline)',process:'From bench to sky',team:'The people',gallery:'Inside the workshop',find:'Find us (offices)',workwith:'Work with us',closing:'Hardware that flies strip'}},
  contact:{label:'Contact',secs:{form:'Contact info + quote form'}}
};
const NEW={
  text:{type:'text',title:'New section',lead:'',text:['Write your text here.'],alt:false},
  banner:{type:'banner',title:'Heading',text:'One line.',btn:{label:'Get a quote',href:'contact.html'}},
  tiles:{type:'tiles',title:'Heading',lead:'',items:[{title:'One',text:'Details'},{title:'Two',text:'Details'}]},
  image:{type:'image',title:'Heading',src:'images/hero.avif',caption:'Caption'},
  html:{type:'html',code:'<p>Your HTML</p>'}
};
const HEAD=`/* LAYOUT.JS - editor.html se bana. Har page ki list = sections ka order.
   // laga hua = hidden. Naye blocks ka format: type: 'text' | 'banner' | 'tiles' | 'image' | 'html'
   Hand se bhi edit kar sakte ho (line upar-niche, copy, delete, //). Phir: node build.js */
`;
const $=s=>document.querySelector(s);
const st={};let cur='home';
const L=window.LAYOUT||{};
Object.keys(PAGES).forEach(p=>{
  const names=Object.keys(PAGES[p].secs),have=Array.isArray(L[p])?L[p]:names;
  st[p]=have.map(x=>typeof x==='string'?{k:x,on:true}:{o:x,on:true});
  names.filter(n=>!have.includes(n)).forEach(n=>st[p].push({k:n,on:false}));
});
function gen(){
  let s=HEAD+'\nwindow.LAYOUT = {\n';
  Object.keys(PAGES).forEach(p=>{
    s+='\n  '+p+': [\n';
    st[p].forEach(r=>{s+='    '+(r.on?'':'// ')+(r.k?"'"+r.k+"'":JSON.stringify(r.o))+',\n'});
    s+='  ],\n';
  });
  return s+'};\n';
}
function move(a,i,j){if(j<0||j>=a.length)return;a.splice(j,0,a.splice(i,1)[0])}
function draw(){
  $('#tabs').innerHTML='';
  Object.keys(PAGES).forEach(p=>{const b=document.createElement('button');b.type='button';b.textContent=PAGES[p].label;b.setAttribute('aria-pressed',p===cur);b.onclick=()=>{cur=p;draw()};$('#tabs').appendChild(b)});
  const list=$('#list');list.innerHTML='';const a=st[cur];let from=-1;
  a.forEach((r,i)=>{
    const d=document.createElement('div');d.className='row'+(r.on?'':' off');d.draggable=true;
    const h=document.createElement('span');h.className='h';h.textContent='\u2630';h.title='Drag';
    const c=document.createElement('input');c.type='checkbox';c.checked=r.on;c.setAttribute('aria-label','Show');c.onchange=()=>{r.on=c.checked;draw()};
    const n=document.createElement('div');n.className='nm';
    const t=document.createElement('b');const sm=document.createElement('small');
    if(r.k){t.textContent=r.k;sm.textContent=PAGES[cur].secs[r.k]||'(is page me ye naam nahi hai: console me warning aayegi)'}
    else{t.textContent='Custom: '+(r.o.type||'?')+(r.o.title?' - '+r.o.title:'');sm.textContent='Neeche JSON edit kar sakte ho';}
    n.append(t,sm);
    if(r.o){const ta=document.createElement('textarea');ta.className='cu';ta.value=JSON.stringify(r.o,null,1);ta.spellcheck=false;
      ta.oninput=()=>{try{r.o=JSON.parse(ta.value);ta.classList.remove('bad');out()}catch(e){ta.classList.add('bad')}};
      ta.onfocus=()=>d.draggable=false;ta.onblur=()=>d.draggable=true;n.appendChild(ta)}
    const up=document.createElement('button');up.type='button';up.className='b';up.textContent='\u2191';up.setAttribute('aria-label','Move up');up.onclick=()=>{move(a,i,i-1);draw()};
    const dn=document.createElement('button');dn.type='button';dn.className='b';dn.textContent='\u2193';dn.setAttribute('aria-label','Move down');dn.onclick=()=>{move(a,i,i+1);draw()};
    d.append(h,c,n,up,dn);
    if(r.o){const x=document.createElement('button');x.type='button';x.className='b';x.textContent='\u2715';x.setAttribute('aria-label','Delete');x.onclick=()=>{a.splice(i,1);draw()};d.appendChild(x)}
    d.ondragstart=e=>{from=i;d.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(i))};
    d.ondragend=()=>d.classList.remove('drag');
    d.ondragover=e=>{e.preventDefault();d.classList.add('over')};
    d.ondragleave=()=>d.classList.remove('over');
    d.ondrop=e=>{e.preventDefault();if(from>-1&&from!==i){move(a,from,i);draw()}};
    list.appendChild(d);
  });
  out();
}
function out(){$('#out').value=gen()}
$('#add').onclick=()=>{st[cur].push({o:JSON.parse(JSON.stringify(NEW[$('#type').value])),on:true});draw()};
const say=m=>{$('#msg').textContent=m;setTimeout(()=>$('#msg').textContent='',2500)};
$('#copy').onclick=()=>{const t=$('#out');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>say('Copied'),()=>{document.execCommand('copy');say('Copied')})};
$('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([gen()],{type:'text/javascript'}));a.download='layout.js';a.click();say('Downloaded')};
draw();
})();
</script>
</body>
</html>
