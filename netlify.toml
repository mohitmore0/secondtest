# Netlify settings. Site static hai: build command nahi chahiye (node build.js aap apne computer par chalate ho).
[build]
  publish = "."

# Admin tool sirf aapke computer ke liye hai. Online site par ye files kholne par 404 aayega.
[[redirects]]
  from = "/admin-server.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/product-admin.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/start-admin.bat"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.txt"
  to = "/404.html"
  status = 404
  force = true

# Old /index.html URL -> clean root URL (one canonical home URL)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Browser caching for static assets, plus basic security headers
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/bundle.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; frame-src https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self' https:; base-uri 'self'; form-action 'self' https:; object-src 'none'; frame-ancestors 'self'"

[[redirects]]
  from = "/indexnow.js"
  to = "/404.html"
  status = 404
  force = true
